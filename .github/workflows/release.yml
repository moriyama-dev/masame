name: Release (Linux x64)

on:
  push:
    tags:
      # Version tags such as 0.1.0 (no "v" prefix), matching meson.build
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential meson ninja-build cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libdbus-1-dev libibus-1.0-dev dpkg-dev

      - name: Determine the version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          MESON_VERSION="$( sed -n "s/^ *version : '\([^']*\)'.*/\1/p" meson.build | head -1 )"
          if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" != "${MESON_VERSION}" ]]; then
            echo "Tag ${REF_NAME} does not match meson.build (${MESON_VERSION})" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${MESON_VERSION}" >> "${GITHUB_ENV}"
          echo "Release version: ${MESON_VERSION}"

      - name: Build the packages
        run: scripts/package-deb.sh "${RELEASE_VERSION}"

      - name: Check the packages
        run: |
          cd dist
          sha256sum -c ./*.sha256
          dpkg-deb -I ./*.deb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.event_name == 'push' || github.event.inputs.prerelease == 'true' }}
        run: |
          NOTES=".github/release-notes/${RELEASE_VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            NOTES="$( mktemp )"
            printf 'Masame %s (Linux x64)\n' "${RELEASE_VERSION}" > "${NOTES}"
          fi

          FLAGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi

          if gh release view "${RELEASE_VERSION}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" dist/* --clobber
          else
            gh release create "${RELEASE_VERSION}" dist/* \
              --title "Masame ${RELEASE_VERSION}" \
              --notes-file "${NOTES}" \
              --target "${GITHUB_SHA}" \
              "${FLAGS[@]}"
          fi
